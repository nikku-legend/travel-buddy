# ===========================================================
# REAL-MYSQL E2E PROFILE  (profile: mysql-e2e)
#
# The default "test" profile runs on H2 with Flyway switched OFF,
# because the migrations use MySQL-only syntax. That is fine for
# business rules, but it leaves three things unproven:
#
#   1. that the 52 Flyway migrations actually apply, in order, to a
#      real MySQL server;
#   2. that the JPA entities still match the migrated schema
#      (ddl-auto=validate, so a drift fails the build);
#   3. that PESSIMISTIC_WRITE row locking actually serialises two
#      concurrent front-desk assignments -- the double-booking
#      guarantee the pom says must be proven before shipping.
#
# This profile points at a genuine MySQL 8 server instead, so all
# three are exercised.
#
# It is opt-in. Surefire's default includes match "*Test", which would
# otherwise pull these classes into a plain `mvn test` and break any
# contributor who has no MySQL running. Each test class therefore
# carries @EnabledIfSystemProperty("travelbuddy.mysql.e2e"="true"),
# which skips the class before Spring starts and never opens a
# connection.
#
# Usage:
#   mvn test -Dtravelbuddy.mysql.e2e=true -Dtest=PartnerMySqlE2ETest
#
# Note: this profile does NOT rebuild the schema. Flyway only validates
# and applies pending migrations, so the schema persists between runs.
# That is deliberate -- a clean run must prove the migration chain
# applies to a real server, and wiping the database first would hide
# exactly that. The tests are written to tolerate leftover rows by
# scoping their assertions to data each test created itself.
# ===========================================================

spring.datasource.url=${E2E_DB_URL:jdbc:mysql://127.0.0.1:3306/travel_buddy_e2e?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${E2E_DB_USERNAME:root}
spring.datasource.password=${E2E_DB_PASSWORD:travelbuddy}

# Flyway ON: applying the real migrations is half the point.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# Validate rather than create: a migration that no longer matches its
# entity must fail here instead of being papered over by Hibernate
# quietly adding a column.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=test-only-secret-key-not-used-for-production-0123456789
app.razorpay.enabled=false
app.kyc.storage-path=./target/test-uploads/kyc
app.voucher.qr-secret=test-only-voucher-signing-key-0123456789abcdef

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN