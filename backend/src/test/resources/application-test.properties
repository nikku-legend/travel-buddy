# ============================================================
# TEST PROFILE
#
# Schema is built from the JPA entities, NOT from Flyway, because the
# migrations use MySQL-only syntax (ENUM, AUTO_INCREMENT,
# ON UPDATE CURRENT_TIMESTAMP) that H2 does not accept.
#
# This is fine for service-level rules, but it means these tests CANNOT
# prove real MySQL concurrency. Tests that must prove row-locking use
# Testcontainers against a genuine MySQL server instead.
# ============================================================

spring.datasource.url=jdbc:h2:mem:travelbuddy;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=false

# Tests must never depend on a real payment gateway or a real secret.
app.jwt.secret=test-only-secret-key-not-used-for-production-0123456789
app.razorpay.enabled=false

app.kyc.storage-path=./target/test-uploads/kyc

# Deterministic test signing key so voucher tests are reproducible.
app.voucher.qr-secret=test-only-voucher-signing-key-0123456789abcdef

logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN