# =========================================================
# TRAVEL BUDDY - APPLICATION CONFIGURATION
# =========================================================

spring.application.name=travel-buddy

# =========================================================
# SERVER
# =========================================================

server.port=8080

# =========================================================
# MYSQL DATABASE
#
# Overridable by environment, with local defaults so the app still
# starts on a developer machine.
#
# The previous version of this file claimed credentials came from
# the environment while hardcoding a live password and ignoring
# DB_URL entirely. Anything that pointed the app at another database
# -- a test run, a staging box, a clean build -- silently used this
# one instead, which is worse than not supporting the variable at
# all: the run reported success against the wrong data.
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_buddy}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:travelbuddy}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# FLYWAY
# =========================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework=INFO
logging.level.com.travelbuddy=DEBUG




# =========================================================
# JWT
#
# The secret must be supplied via the environment. There is no
# default on purpose: a committed fallback secret is a committed
# credential, and anyone with it can mint valid admin tokens.
# Generate one with:
#   openssl rand -base64 48
# =========================================================

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}



# =========================================================
# JWT
# =========================================================

#app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_FOR_DEVELOPMENT_ONLY
#
## Access token = 15 minutes
#app.jwt.expiration-ms=900000

# Refresh token = 7 days
app.jwt.refresh-expiration-ms=604800000

# A pending booking reserves its rooms only during this payment window.
app.booking-hold.duration-minutes=15
app.booking-hold.cleanup-interval-ms=60000

# =========================================================
# PARTNER KYC DOCUMENT STORAGE
#
# Uploaded identity, licence and registration documents are written
# outside the classpath under server-generated random filenames.
# Keep this directory OUTSIDE any folder served by the web server.
# =========================================================

app.kyc.storage-path=${KYC_STORAGE_PATH:./uploads/kyc}

# ============================================================
# INVENTORY
#
# How many days of daily inventory are generated when a partner
# creates or resizes a room type. Availability checks read
# room_inventory_daily for every requested night, so a room beyond
# this horizon looks unavailable.
# ============================================================

app.inventory.horizon-days=${INVENTORY_HORIZON_DAYS:365}

# ============================================================
# FIRST SUPER ADMIN BOOTSTRAP
#
# Leave BOTH blank to disable. A production deployment must leave
# them empty, otherwise the application will create a known admin
# account on every start.
#
# To bootstrap the very first administrator, set these once, start
# the application, sign in, then clear them again. The runner never
# overwrites an account that already exists, so restarts are safe.
# ============================================================

app.bootstrap.admin-email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin-name=${BOOTSTRAP_ADMIN_NAME:Travel Buddy Admin}

# ============================================================
# DIGITAL VOUCHER AND QR SIGNING
#
# HMAC key for the signed token encoded into a voucher QR code.
#
# MUST be at least 32 bytes; the application refuses to start
# otherwise, because a weak or empty key would make every
# voucher forgeable.
#
# Defaults to JWT_SECRET when unset so a single secret is
# enough for development, but a DEDICATE value is strongly
# advised in production: rotating the JWT key would then not
# silently invalidate every outstanding voucher.
# ============================================================

app.voucher.qr-secret=${VOUCHER_QR_SECRET:${JWT_SECRET:}}

# How often vouchers past their valid_until are swept to .
app.voucher.expiry-sweep-ms=${VOUCHER_EXPIRY_SWEEP_MS:3600000}

# Spring multipart limits, enforced before a request reaches the
# controller. Kept in step with KycStorageService.MAX_FILE_BYTES.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# =========================================================
# RAZORPAY PAYMENT GATEWAY
# =========================================================
# Test-mode keys. Generate real ones from the Razorpay Dashboard
# (Account & Settings -> API Keys) and override them with environment
# variables in production; never commit live keys.
app.razorpay.enabled=${RAZORPAY_ENABLED:false}
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_0000000000000}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:CHANGE_THIS_TEST_SECRET}
app.payment.mock-enabled=${MOCK_PAYMENT_ENABLED:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5500,http://127.0.0.1:5500,http://localhost:5501,http://127.0.0.1:5501}
